<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>Select Panchayat | Weather AI</title>

    <link rel="stylesheet"
        href="css/style.css">

    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Poppins:wght@400;500;600;700;800&display=swap"
        rel="stylesheet">

</head>


<body class="selection-page">


    <div class="selection-background">

        <div class="selection-glow glow-one"></div>

        <div class="selection-glow glow-two"></div>

    </div>



    <div class="selection-container">


        <div class="selection-logo">

            🌦️

            <h2>
                Panchayat Weather AI
            </h2>

        </div>



        <div class="selection-card glass-card">


            <div class="selection-header">

                <span class="step-badge">
                    STEP 01 / 02
                </span>

                <h1>
                    Select Your
                    <span>Panchayat</span>
                </h1>

                <p>
                    Choose your location to access
                    localized weather intelligence.
                </p>

            </div>



            <div class="location-form">


                <div class="form-group">

                    <label>State</label>

                    <select id="state">

                        <option>
                            Telangana
                        </option>

                        <option>
                            Andhra Pradesh
                        </option>

                        <option>
                            Karnataka
                        </option>

                    </select>

                </div>



                <div class="form-group">

                    <label>District</label>

                    <select id="district">

                        <option>
                            Medak
                        </option>

                        <option>
                            Hyderabad
                        </option>

                        <option>
                            Sangareddy
                        </option>

                    </select>

                </div>



                <div class="form-group">

                    <label>Mandal</label>

                    <select id="mandal">

                        <option>
                            Chegunta
                        </option>

                        <option>
                            Toopran
                        </option>

                        <option>
                            Narsapur
                        </option>

                    </select>

                </div>



                <div class="form-group">

                    <label>Panchayat</label>

                    <select id="panchayat">

                        <option>
                            Chegunta
                        </option>

                        <option>
                            Ramayampet
                        </option>

                        <option>
                            Wadiaram
                        </option>

                    </select>

                </div>



                <button
                    class="primary-button full-button"
                    onclick="goTo('dashboard.html')">

                    Continue to Dashboard
                    <span>→</span>

                </button>


            </div>



            <div class="location-info">

                <div>📍</div>

                <p>
                    Weather intelligence will be
                    customized for your selected
                    Panchayat.
                </p>

            </div>

        </div>


        <div class="selection-footer">

            🔒 Demo Environment • SIH26074

        </div>

    </div>



    <script src="js/script.js"></script>

</body>

</html>
